apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous-ai-backend
  namespace: autonomous-ai-devops

spec:
  replicas: 1
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: autonomous-ai-backend

  template:
    metadata:
      labels:
        app: autonomous-ai-backend

    spec:
      containers:
        - name: backend
          image: autonomous-ai-backend:monitoring-api-v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
              name: http

          envFrom:
            - configMapRef:
                name: autonomous-ai-config

            - secretRef:
                name: autonomous-ai-backend-secrets

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi
