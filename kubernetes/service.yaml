apiVersion: v1
kind: Service
metadata:
  name: autonomous-ai-backend-service
  namespace: autonomous-ai-devops
  labels:
    app: autonomous-ai-backend
spec:
  type: NodePort
  selector:
    app: autonomous-ai-backend
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
