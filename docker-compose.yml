services:
  postgres:
    image: postgres:16
    container_name: autonomous-ai-postgres
    environment:
      POSTGRES_DB: autonomous_ai_devops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autonomous_ai_devops"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: autonomous-ai-backend:latest
    build:
      context: ./backend
    container_name: autonomous-ai-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/autonomous_ai_devops
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: autonomous-ai-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: